plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.xreal360.viewer'
    compileSdk 35

    defaultConfig {
        applicationId "com.xreal360.viewer"
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName "1.1.2"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // ExoPlayer for 360 video
    implementation 'androidx.media3:media3-exoplayer:1.2.1'

    // The current tracker uses the local io.onexr socket client, so do not package
    // the large XREAL SDK AARs from app/libs by default.
    // implementation fileTree(dir: 'libs', include: ['*.aar'], exclude: ['nractivitylife-release.aar'])

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    //new


}
