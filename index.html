    <style>
      :root {
        color-scheme: dark;
        --background: #303030;
        --button: #474747;
        --button-border: #5f5f5f;
        --logo: #ff8528;
        --text: #c9c9c9;
        --muted: #a1a1a1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow-x: hidden;
        background: var(--background);
        color: var(--text);
        font-family: sans-serif;
        text-align: center;
      }

      main {
        display: flex;
        width: min(100%, 520px);
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 28px;
      }

      .logo {
        width: clamp(170px, 48vw, 188px);
        height: auto;
        margin-bottom: 5px;
      }

      h1 {
        margin: 0;
        color: var(--text);
        font-size: clamp(17px, 4.8vw, 22px);
        font-weight: 400;
        line-height: 1.14;
        letter-spacing: 0.16em;
        white-space: nowrap;
      }

      .credit {
        margin: 7px 0 42px;
        color: var(--text);
        font-size: 10px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.64em;
      }

      .download-wrap {
        position: relative;
        display: grid;
        place-items: center;
        width: 336px;
        height: 73px;
        max-width: 100%;
        margin: 0 auto;
      }

      .download-wrap::before {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 133, 40, 0.6);
        border-radius: 35px;
        background: rgba(255, 133, 40, 0.3);
        content: "";
        opacity: 0.25;
      }

      .download {
        position: relative;
        z-index: 1;
        display: inline-flex;
        width: 312px;
        height: 57px;
        max-width: calc(100vw - 56px);
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 1px solid var(--button-border);
        border-radius: 29px;
        background: var(--button);
        box-shadow: 0 4px 11px rgba(0, 0, 0, 0.28);
        color: var(--text);
        font-size: 11px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.24em;
        text-decoration: none;
        text-transform: uppercase;
        white-space: nowrap;
        transition:
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .download:hover,
      .download:focus-visible {
        border-color: var(--logo);
        color: #ffffff;
        transform: translateY(-1px);
      }

      .download svg {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .title-line {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .title-line svg {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .title-line a {
        color: inherit;
        text-decoration: none;
      }

      .title-line a:hover,
      .title-line a:focus-visible {
        color: var(--logo);
        text-decoration: none;
      }

      .github {
        display: inline-flex;
        max-width: 100%;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 24px;
        padding: 9px 14px;
        border: 1px solid var(--button-border);
        border-radius: 999px;
        background: rgba(71, 71, 71, 0.72);
        box-shadow: 0 3px 9px rgba(0, 0, 0, 0.22);
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: 0.12em;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .github svg {
        width: 23px;
        height: 23px;
        flex: 0 0 auto;
        fill: currentColor;
      }

      .github:hover,
      .github:focus-visible {
        border-color: var(--logo);
        color: var(--logo);
        text-decoration: none;
      }

      .video {
        position: relative;
        display: block;
        width: min(100%, 315px);
        margin-top: 28px;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--button-border);
        border-radius: 12px;
        background: #222222;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26);
        overflow: hidden;
      }

      .video iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .video:hover,
      .video:focus-visible {
        border-color: var(--logo);
      }

      .download:focus-visible,
      .github:focus-visible,
      .video:focus-visible {
        outline: 2px solid rgba(255, 133, 40, 0.78);
        outline-offset: 6px;
      }

      @media (max-width: 420px) {
        main {
          padding: 42px 24px;
        }

        h1 {
          max-width: 13ch;
        }

        .credit {
          max-width: 24ch;
          line-height: 1.6;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
